<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de cálculo</title>
    <!--Archivo CSS-->
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!--Encabezado-->
    <header>
        <h1>Formulario de cálculo</h1>
    </header>

    <!--seccion de contenedores-->
    <section id="contenedores_calculos">
        <!--Contenedores de cada problema-->
        <!--Suma-->
        <div class="contenedor_calculo">
            <h2>Calcular suma</h2>
            <div class="datos_suma">
                <label for="num1_suma">Valor 1</label>
                <input type="text" id="num1_suma">
            </div>
            <div class="datos_suma">
                <label for="num2_suma">Valor 2</label>
                <input type="text" id="num2_suma">
            </div>
            <div class="datos_suma">
                <label for="num3_suma">Valor 3</label>
                <input type="text" id="num3_suma">
            </div>
            <button onclick="Suma()">Sumar</button>
            <br>
            <span id="resultado_suma"></span>
        </div>

        <!--Elevar un numero al cuadrado-->
        <div class="contenedor_calculo">
            <h2>Calcular cuadrado</h2>
            <div>
                <label for="valor_cuadrado">Ingrese un valor:</label>
                <input type="text" id="valor_cuadrado">
            </div>
            <button onclick="Cuadrado()">Calcular</button>
            <br>
            <span id="resultado_cuadrado"></span>
        </div>

        <!--Calcular el promedio del Estudiante-->
        <div class="contenedor_calculo">
            <h2>Calcular promedio</h2>
            <div class="datos_promedio">
                <label for="nombre_estudiante">Nombre del estudiante</label>
                <input type="text" id="nombre_estudiante">
            </div>
            <div class="datos_promedio">
                <label for="valor1_calificacion">Calificación 1</label>
                <input type="text" id="valor1_calificacion">
            </div>
            <div class="datos_promedio">
                <label for="valor2_calificacion">Calificación 2</label>
                <input type="text" id="valor2_calificacion">
            </div>
            <div class="datos_promedio">
                <label for="valor3_calificacion">Calificación 3</label>
                <input type="text" id="valor3_calificacion">
            </div>
            <button onclick="Promedio()">Calcular</button>
            <br>
            <span id="resultado_promedio"></span>
        </div>

        <!--Conversion de unidades-->
        <div class="contenedor_calculo">
            <h2>Conversión de unidades</h2>
            <div class="datos_unidades">
                <label for="valor_unidades">Ingrese su valor en metros:</label>
                <input type="text" id="valor_unidades">
            </div>
            <button onclick="Conversion()">Convertir</button>
            <br>
            <span id="resultado_conversion"></span>
        </div>

        <!--Comparacion de nuemros y su diferencia-->
        <div class="contenedor_calculo">
            <h2>Comparación de datos</h2>
            <div class="datos_comparacion">
                <label for="valor1_comparacion">Ingrese el valor 1</label>
                <input type="text" id="valor1_comparacion">
            </div>
            <div class="datos_comparacion">
                <label for="valor2_comparacion">Ingrese el valor 2</label>
                <input type="text" id="valor2_comparacion">
            </div>
            <button onclick="Comparacion()">Comparar</button>
            <br>
            <span id="resultado_comparacion"></span>
        </div>

    </section>

    <!--Archivo JS-->
    <script src="app.js"></script>
</body>
</html>
